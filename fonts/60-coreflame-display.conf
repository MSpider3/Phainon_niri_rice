<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Optional: Coreflame Display as the system's default sans, serif and UI font. It only covers
     basic Latin, so accents, symbols and other scripts still come from the font behind it.
     Monospace (terminals, code) is left alone. Use this or 60-coreflame-numerals.conf, not both.
     Install: cp fonts/60-coreflame-display.conf ~/.config/fontconfig/conf.d/
              gsettings set org.gnome.desktop.interface font-name 'Coreflame Display 11'
     Remove:  delete the file and set font-name back. -->
<fontconfig>
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Coreflame Display</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Coreflame Display</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>system-ui</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Coreflame Display</string></edit>
  </match>
</fontconfig>
