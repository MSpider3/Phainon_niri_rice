<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Optional: numbers in apps that use fontconfig (GTK, browsers' default fonts) drawn with the
     Coreflame numerals. "Coreflame Numerals" has only 0-9, so every other character still comes
     from the font behind it. Monospace (terminals, code) is left alone so digits stay readable.
     Install: cp fonts/60-coreflame-numerals.conf ~/.config/fontconfig/conf.d/   Remove: delete it. -->
<fontconfig>
  <!-- The GTK interface font (gsettings font-name); change or copy this block if yours differs. -->
  <match target="pattern">
    <test name="family"><string>Rajdhani</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Coreflame Numerals</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Coreflame Numerals</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Coreflame Numerals</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>system-ui</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Coreflame Numerals</string></edit>
  </match>
</fontconfig>
